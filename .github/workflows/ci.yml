name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]


permissions:
    contents: read


concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
   
jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
          - uses:   actions/checkout@v7
          
          - uses: actions/setup-dotnet@v6
            with:
              global-json-file: global.json
            
          - name: CI gate
            run: dotnet run build/ci.cs